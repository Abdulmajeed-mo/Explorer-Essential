<div dir="rtl" class="w-full  min-h-96 rounded-2xl bg-[#EAA043]/90 p-6">

  <div class="mb-6 flex items-center justify-between">
    <h2 class="text-2xl font-bold text-[#264431]">
      {{ name }}
    </h2>

    <button
  (click)="openAddTask.emit()"
      class="rounded-lg bg-[#264431] px-4 py-2 font-bold text-[#ffe4c4] hover:bg-[#719687] hover:text-[#ffffff]"
    >
      إضافة مهمة 
    </button>

  </div>
<div class="max-h-96 overflow-y-auto space-y-4">

  @for (task of tasks; track task.id) {
    <div class="rounded-xl bg-[#264431] p-4">

      <h3 class="text-xl font-bold text-[#ffe4c4]">
        {{ task.title }}
      </h3>

      <p class="mt-2 text-[#ffe4c4]">
        التاريخ :<br> {{ task.date }}
      </p>

      <p class="mt-2 text-[#ffe4c4]">
        الوصف : <br> {{ task.description }}
      </p>

      <div class="flex justify-center">

        <button
          (click)="completeTask.emit(task.id)"
          class="mt-4 rounded-lg border bg-[#264431] px-4 py-2 font-bold text-[#ffe4c4] hover:bg-[#EAA043] hover:text-[#264431]"
        >
          {{ task.completed ? 'مكتملة' : 'إكمال المهمة' }}
        </button>

        <button
          (click)="deleteTask.emit(task.id)"
          class="mt-4 ml-2 rounded-lg border bg-[#264431] px-4 py-2 font-bold text-[#ffe4c4] hover:bg-[#EAA043] hover:text-[#264431]"
        >
          حذف المهمة
        </button>

      </div>

    </div>
  }

</div>
